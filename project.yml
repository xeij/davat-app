name: Davat
options:
  bundleIdPrefix: com.davat
  deploymentTarget:
    iOS: "26.0"
packages:
  DavatKit:
    path: DavatKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Davat:
    type: application
    platform: iOS
    sources: [Davat]
    dependencies:
      - package: DavatKit
    entitlements:
      path: Davat/Davat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.davat.app]
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:davat.vercel.app"]
    info:
      path: Davat/Info.plist
      properties:
        CFBundleDisplayName: davat
        UILaunchScreen: {}
        SupabaseURL: ""
        SupabaseAnonKey: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Davat:
    build:
      targets:
        Davat: all
    run:
      config: Debug
