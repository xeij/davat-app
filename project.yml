name: Davat
options:
  bundleIdPrefix: com.davat
  deploymentTarget:
    iOS: "26.0"
packages:
  DavatKit:
    path: DavatKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Davat:
    type: application
    platform: iOS
    sources: [Davat]
    dependencies:
      - package: DavatKit
      - target: DavatMessages
    entitlements:
      path: Davat/Davat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.davat.app]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.davat.shared"]
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:davat.vercel.app"]
    info:
      path: Davat/Info.plist
      properties:
        CFBundleDisplayName: davat
        UILaunchScreen: {}
        SupabaseURL: ""
        SupabaseAnonKey: ""
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davat.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  DavatMessages:
    type: app-extension.messages
    platform: iOS
    sources: [DavatMessages]
    dependencies:
      - package: DavatKit
    entitlements:
      path: DavatMessages/DavatMessages.entitlements
      properties:
        com.apple.security.application-groups: [group.com.davat.app]
        keychain-access-groups: ["$(AppIdentifierPrefix)com.davat.shared"]
    info:
      path: DavatMessages/Info.plist
      properties:
        CFBundleDisplayName: davat
        SupabaseURL: ""
        SupabaseAnonKey: ""
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davat.app.messages
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
        TARGETED_DEVICE_FAMILY: "1"
  DavatUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DavatUITests]
    dependencies:
      - target: Davat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davat.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Davat:
    build:
      targets:
        Davat: all
    test:
      targets: [DavatUITests]
    run:
      config: Debug
